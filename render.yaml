services:
  # Django web service (Free tier)
  - type: web
    name: truckrouter-web
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: 'False'
      - key: ALLOWED_HOSTS
        value: '.onrender.com'
      - key: DATABASE_URL
        fromDatabase:
          name: truckrouter-db
          property: connectionString
      - key: ORS_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false

databases:
  # PostgreSQL database (Free tier)
  - name: truckrouter-db
    plan: free
    ipAllowList: []
