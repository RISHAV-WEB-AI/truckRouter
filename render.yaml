services:
  # Django web service
  - type: web
    name: truckrouter-web
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: 'False'
      - key: ALLOWED_HOSTS
        value: '.onrender.com'
      - key: CELERY_BROKER_URL
        fromService:
          name: truckrouter-redis
          type: redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: truckrouter-redis
          type: redis
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: truckrouter-db
          property: connectionString
      - key: ORS_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false

  # Celery worker
  - type: worker
    name: truckrouter-worker
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    dockerCommand: celery -A truckrouter worker --loglevel=info
    envVars:
      - key: DJANGO_SECRET_KEY
        fromService:
          name: truckrouter-web
          type: web
          envVarKey: DJANGO_SECRET_KEY
      - key: CELERY_BROKER_URL
        fromService:
          name: truckrouter-redis
          type: redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: truckrouter-redis
          type: redis
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: truckrouter-db
          property: connectionString
      - key: ORS_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false

  # Redis
  - type: redis
    name: truckrouter-redis
    plan: free

databases:
  - name: truckrouter-db
    plan: free
